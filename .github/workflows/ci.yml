name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write # Permite subir imágenes a GitHub Container Registry

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Ejecución de linter
        run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    name: Construir imagen Docker
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tags y metadatos para la imagen Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construir y publicar imagen Docker en GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Smoke test del contenedor, obtiene el segundo tag generado y lo usa para levantar un contenedor y hacer un par de requests
      - name: Smoke test del contenedor 
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="$(printf '%s\n' "$IMAGE" | sed -n '2p')"
          echo "Usando imagen: $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name frontend -p 8080:8080 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/experiencias | grep -q '<div id="root">'
          docker logs frontend